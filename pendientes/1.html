<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&display=swap" rel="stylesheet"><style>
/* PLANTILLA GIOVEGEN STORY 1080x1920 — colores tomados de piezas reales (skin-02.jpg). Claude solo completa {{campos}} */
:root{--teal:#61a3a2;--teal-deep:#5a9e9f;--floor:#a9e1e2;--ink:#232323;--pink:#e6197f}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;font-family:'Montserrat',sans-serif;overflow:hidden;position:relative;
 background:linear-gradient(180deg,var(--teal) 0%,var(--teal-deep) 62%,#7fc0c1 80%,var(--floor) 100%)}
.logo{position:absolute;top:130px;width:100%;text-align:center;font-weight:300;font-size:44px;letter-spacing:22px;color:#fff}
.title{position:absolute;top:260px;left:80px;right:80px;text-align:center;font-weight:800;font-size:112px;line-height:1.02;color:#fff}
.sub{position:absolute;top:400px;left:130px;right:130px;text-align:center;font-weight:300;font-size:44px;line-height:1.35;color:var(--ink)}
.pack{position:absolute;top:640px;left:50%;transform:translateX(-50%);height:880px;
 filter:drop-shadow(0 40px 45px rgba(0,60,70,.35))}
.cta{position:absolute;bottom:170px;left:50%;transform:translateX(-50%);background:var(--pink);color:#fff;
 padding:32px 84px;border-radius:100px;font-weight:600;font-size:44px;white-space:nowrap}
.seal{position:absolute;bottom:80px;width:100%;text-align:center;font-weight:300;font-size:28px;letter-spacing:2px;color:var(--ink)}
</style></head><body>
<div class="logo">GIOVEGEN</div>
<div class="title">Piel radiante</div>
<div class="sub">Cuidado de la piel desde adentro</div>
<img class="pack" src="../assets/giovegen_skin.png">
<div class="cta">Comprá ahora</div>
<div class="seal">Aprobado por ANMAT · 6 cuotas sin interés</div>
</body></html>
