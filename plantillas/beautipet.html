<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&display=swap" rel="stylesheet"><style>
/* PLANTILLA BEAUTIPET STORY 1080x1920 - colores tomados de piezas reales. Claude completa los {{campos}} y puede variar la composicion */
:root{--red:#de475a;--red-top:#e45768;--glow:#f88f9e}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;font-family:'Montserrat',sans-serif;overflow:hidden;position:relative;color:#fff;
 background:radial-gradient(circle at 18% 22%,var(--glow) 0,rgba(248,143,158,0) 42%),
            radial-gradient(circle at 95% 62%,rgba(248,143,158,.55) 0,rgba(248,143,158,0) 35%),
            linear-gradient(180deg,var(--red-top) 0%,var(--red) 100%)}
.paw{position:absolute;opacity:.16;fill:#fff}
.logo{position:absolute;top:110px;left:50%;transform:translateX(-50%);height:110px}
.bigword{position:absolute;top:300px;left:0;width:100%;text-align:center;font-weight:800;font-size:250px;line-height:.92;
 color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.35);text-transform:uppercase}
.pack{position:absolute;top:470px;left:50%;transform:translateX(-50%) rotate(-3deg);height:800px;
 filter:drop-shadow(0 45px 45px rgba(120,0,25,.4))}
.title{position:absolute;top:1340px;left:70px;right:70px;text-align:center;font-weight:800;font-size:66px;line-height:1.08;text-transform:uppercase}
.cta{position:absolute;bottom:200px;left:50%;transform:translateX(-50%);background:#fff;color:var(--red);
 padding:30px 74px;border-radius:22px;font-weight:600;font-size:42px;white-space:nowrap}
.seal{position:absolute;bottom:90px;width:100%;text-align:center;font-weight:600;font-size:30px;letter-spacing:1px;opacity:.95}
</style></head><body>
<svg class="paw" style="top:1500px;left:30px;width:170px" viewBox="0 0 100 100"><ellipse cx="50" cy="66" rx="24" ry="20"/><ellipse cx="22" cy="40" rx="10" ry="13"/><ellipse cx="42" cy="26" rx="10" ry="13"/><ellipse cx="62" cy="26" rx="10" ry="13"/><ellipse cx="80" cy="40" rx="10" ry="13"/></svg>
<svg class="paw" style="top:230px;left:870px;width:150px;transform:rotate(18deg)" viewBox="0 0 100 100"><ellipse cx="50" cy="66" rx="24" ry="20"/><ellipse cx="22" cy="40" rx="10" ry="13"/><ellipse cx="42" cy="26" rx="10" ry="13"/><ellipse cx="62" cy="26" rx="10" ry="13"/><ellipse cx="80" cy="40" rx="10" ry="13"/></svg>
<svg class="paw" style="top:1620px;left:860px;width:190px;transform:rotate(-14deg)" viewBox="0 0 100 100"><ellipse cx="50" cy="66" rx="24" ry="20"/><ellipse cx="22" cy="40" rx="10" ry="13"/><ellipse cx="42" cy="26" rx="10" ry="13"/><ellipse cx="62" cy="26" rx="10" ry="13"/><ellipse cx="80" cy="40" rx="10" ry="13"/></svg>
<img class="logo" src="../assets/bp_logo_white.png">
<div class="bigword">{{palabra_grande}}<br>{{palabra_grande}}</div>
<img class="pack" src="../assets/{{producto_archivo}}">
<div class="title">{{titulo}}</div>
<div class="cta">{{cta}}</div>
<div class="seal">{{sello}}</div>
</body></html>
