name: Renderizar historias
on:
  push:
    paths: ['pendientes/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node render.mjs
      - name: Guardar imagenes
        run: |
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add out
          git diff --cached --quiet || (git commit -m "Historias renderizadas" && git pull --rebase && git push)
